<style>
#compact-match-options .cm{--bg:#091522;--panel:#102438;--line:#294257;--text:#e1edf8;--dim:#9bb1c5;--blue:#55c6ff;--red:#ff8499;--green:#42ddb2;--rh:26px;background:var(--bg);color:var(--text);font:13px/1.4 'Microsoft YaHei','Segoe UI',sans-serif;border:1px solid var(--line);border-radius:9px;overflow:clip;font-variant-numeric:tabular-nums}
#compact-match-options .cm *{box-sizing:border-box}#compact-match-options .cm button{font:inherit;background:#16334b;color:var(--text);border:1px solid #31536c;border-radius:4px;padding:4px 10px;cursor:inherit}#compact-match-options .cm button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#compact-match-options .cm-chrome{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;flex-wrap:wrap;background:#0d1f30}#compact-match-options .cm-brand{color:var(--blue);font-weight:700}#compact-match-options .cm-dim{color:var(--dim)}#compact-match-options .cm-right{margin-left:auto}#compact-match-options .cm-chrome small{font-size:11px;color:var(--dim)}
#compact-match-options .cm-match{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:11px 14px;border-left:3px solid var(--green);background:#15334a}#compact-match-options .cm-win{color:var(--green)}#compact-match-options .cm-loss{color:var(--red)}#compact-match-options .cm-match b{font-size:15px}#compact-match-options .cm-match button{margin-left:auto}
#compact-match-options .cm-body{padding:10px 12px 12px}#compact-match-options .cm-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim);padding:0 0 9px}#compact-match-options .cm-team{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 8px;font-weight:600;color:var(--blue);background:#10283b}#compact-match-options .cm-team small{font-weight:400;font-size:11px;color:var(--dim)}#compact-match-options .cm-team.enemy{color:var(--red);background:#261f30}
#compact-match-options .cm-identity{display:flex;align-items:center;gap:7px;min-width:0}#compact-match-options .cm-portrait{display:grid;place-items:center;background:#3c3540;border:1px solid #8c7356;border-radius:3px;width:29px;height:31px;color:#ead7b0;font-size:14px;flex-shrink:0}#compact-match-options .cm-name{font-weight:600;font-size:12px;overflow-wrap:anywhere}#compact-match-options .cm-identity small{font-size:11px;color:var(--dim);font-weight:400}
#compact-match-options .cm-kda{font-weight:700;font-size:14px}#compact-match-options .cm-kda small{font-size:11px;color:var(--dim);font-weight:400}#compact-match-options .cm-slot{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;background:#233e51;border:1px solid #426077;border-radius:3px;font-size:11px;color:#e3d9bd}#compact-match-options .cm-spell{background:#5c4726;color:#ffe1a3}#compact-match-options .cm-gear{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}#compact-match-options .cm-load{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:11px;color:var(--dim)}#compact-match-options .cm-runes{color:#bbcfdf;font-size:11px;overflow-wrap:anywhere}#compact-match-options .cm-aux{font-size:11px;color:var(--dim)}#compact-match-options .cm-self{background:#113047!important;box-shadow:inset 2px 0 var(--blue)}
#compact-match-options .cm-dense-head,#compact-match-options .cm-dense-main{display:grid;grid-template-columns:minmax(175px,1.85fr) 105px repeat(7,minmax(55px,1fr));align-items:center;gap:7px}#compact-match-options .cm-dense-head{font-size:11px;color:var(--dim);padding:5px 8px}#compact-match-options .cm-dense-row{padding:6px 8px;background:#0c1d2c;border-bottom:1px solid var(--line)}#compact-match-options .cm-dense-main{min-height:31px}#compact-match-options .cm-dense-main>span{text-align:right}#compact-match-options .cm-dense-secondary{display:flex;gap:5px 12px;align-items:center;flex-wrap:wrap;margin-top:4px}#compact-match-options .cm-dense-secondary .cm-aux{margin-left:auto}#compact-match-options .cm-dense-secondary .cm-runes{flex:1 1 330px}
#compact-match-options .cm-bottom{display:flex;align-items:center;gap:8px 15px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;font-size:11px;color:var(--dim)}#compact-match-options .cm-banline{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding:9px 2px 0;font-size:11px;color:var(--dim)}
#compact-match-options .cm-versus-head{display:grid;grid-template-columns:1fr 1fr;gap:10px}#compact-match-options .cm-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--line)}#compact-match-options .cm-pcard{padding:5px 8px;background:#0d2031;min-width:0}#compact-match-options .cm-pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}#compact-match-options .cm-pcard .cm-name{font-size:12px}#compact-match-options .cm-pcard-metrics{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:3px 0}#compact-match-options .cm-pcard-metrics span{font-size:11px;color:var(--dim)}#compact-match-options .cm-pcard-metrics b{display:block;color:var(--text);font-size:12px;font-weight:500}#compact-match-options .cm-pcard .cm-runes{margin-top:4px}#compact-match-options .cm-pcard .cm-aux{margin-top:3px}
#compact-match-options .cm-matrix-wrap{overflow-x:auto}#compact-match-options .cm-matrix{border-collapse:collapse;width:100%;table-layout:fixed;min-width:900px;font-size:12px}#compact-match-options .cm-matrix th,#compact-match-options .cm-matrix td{border-bottom:1px solid #20394d;padding:4px 5px;text-align:center;vertical-align:middle;overflow-wrap:anywhere;height:var(--rh)}#compact-match-options .cm-matrix th{font-weight:400;color:var(--dim);font-size:11px}#compact-match-options .cm-matrix th:first-child,#compact-match-options .cm-matrix td:first-child{width:95px;text-align:left;background:#102537;color:#bcd0e0}#compact-match-options .cm-matrix .cm-team-band th{color:var(--blue);font-weight:600;background:#10283b}#compact-match-options .cm-matrix .cm-team-band th:last-child{color:var(--red);background:#261f30}#compact-match-options .cm-matrix .cm-name{font-size:11px}#compact-match-options .cm-matrix .cm-portrait{margin:0 auto 4px}#compact-match-options .cm-matrix td.cm-self{box-shadow:none}#compact-match-options .cm-matrix .cm-gear{justify-content:center}#compact-match-options .cm-matrix .cm-runes{line-height:1.65}#compact-match-options .cm-matrix .cm-separator td{height:23px;background:#102537;color:var(--blue);text-align:left;font-size:11px;font-weight:600}#compact-match-options .cm-matrix .cm-multikill{font-size:11px}#compact-match-options .cm-body[hidden]{display:none}
@media(max-width:1100px){#compact-match-options .cm-dense-head,#compact-match-options .cm-dense-main{grid-template-columns:minmax(158px,1.6fr) 85px repeat(7,minmax(45px,1fr));gap:4px}#compact-match-options .cm-dense-secondary .cm-aux{margin-left:0}#compact-match-options .cm-pcard-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}#compact-match-options .cm-pcard .cm-runes{line-height:1.5}}
@media(max-width:740px){#compact-match-options .cm-dense-head{display:none}#compact-match-options .cm-dense-main{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}#compact-match-options .cm-dense-main .cm-identity{grid-column:span 3}#compact-match-options .cm-dense-main>span{text-align:left}#compact-match-options .cm-dense-main>span[data-label]::before{content:attr(data-label) ' ';color:var(--dim);font-size:11px}#compact-match-options .cm-versus-head,#compact-match-options .cm-pair{grid-template-columns:1fr}#compact-match-options .cm-pcard{border-left:2px solid var(--blue)}#compact-match-options .cm-pcard.enemy{border-left-color:var(--red)}#compact-match-options .cm-match{gap:7px 12px}#compact-match-options .cm-pcard-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}#compact-match-options .cm-body{padding:9px}#compact-match-options .cm-dense-secondary .cm-runes{flex-basis:100%}}
#compact-match-options .cm-metric-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 8px;color:var(--dim);font-size:11px}#compact-match-options .cm-matrix .cm-portrait{display:none}#compact-match-options .cm-fullrunes{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:1200px){#compact-match-options .cm-fullrunes{grid-template-columns:1fr 1fr;gap:0 3px}}@media(max-width:1100px){#compact-match-options .cm-metric-labels{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<div id="compact-match-options" class="viz-carousel" aria-label="紧凑对局详情设计" data-previous-label="上一方案" data-next-label="下一方案">
  <section data-variant="双队五行对照" aria-label="双队五行对照设计"><div id="cm-paired" class="cm"></div></section>
  <section data-variant="双行紧凑记分板" aria-label="双行紧凑记分板设计" hidden><div id="cm-dense" class="cm"></div></section>
  <section data-variant="全员字段矩阵" aria-label="全员字段矩阵设计" hidden><div id="cm-matrix" class="cm"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('compact-match-options');
const raw=[['我 · 墨言奇楠天','亚托克斯',16,1,7,32580,23400,12460,15180,221,24,138],['空城Superficial','阿狸',8,5,13,24360,14800,2560,12640,186,21,91],['咖啡里已冰冷','金克丝',12,3,10,28920,16420,1820,14290,246,18,42],['长远头漂砥','蕾欧娜',1,6,23,6840,28740,1740,8620,39,52,246],['召唤师32268','李青',5,4,17,17360,26800,6370,11780,164,33,112],['晚风与山海','德莱厄斯',6,9,4,19740,32100,8650,11020,192,17,89],['月色有点凉','辛德拉',7,7,6,22180,14520,1260,11850,201,23,87],['今天早点休息','卡莎',4,8,10,20560,15380,2300,12340,226,16,35],['一杯温水','诺提勒斯',0,9,17,5960,28300,1060,7900,32,48,238],['峡谷旅行者','佛耶戈',2,9,10,14820,24160,5340,10910,176,26,76]];
const players=raw.map((p,i)=>({name:p[0],hero:p[1],k:p[2],d:p[3],a:p[4],damage:p[5],taken:p[6],heal:p[7],gold:p[8],cs:p[9],vision:p[10],cc:p[11],level:i===3||i===8?14:17,tag:['67974','1024','0824','4491','0036','1207','6631','2145','7384','8876'][i],self:i===0,enemy:i>=5,index:i,spree:[7,3,5,1,3,3,3,2,0,2][i],multi:i===0?'3/1/0/0':i===2?'2/1/0/0':i===3||i===8||i===9?'0/0/0/0':'1/0/0/0'}));
const fmt=n=>n.toLocaleString('en-US');
const kda=p=>((p.k+p.a)/Math.max(1,p.d)).toFixed(2);
const runes=['征服者','凯旋','欢欣','坚毅不倒','复苏之风','坚定','攻速','适应之力','生命值'];
const identity=p=>`<div class="cm-identity"><span class="cm-portrait">${p.hero[0]}</span><span class="cm-name">${p.name}<br><small>#${p.tag} · ${p.hero} · Lv.${p.level}</small></span></div>`;
const gear=p=>`<span class="cm-gear">${['闪现',p.index===3||p.index===8?'点燃':'传送'].map(n=>`<span class="cm-slot cm-spell">${n}</span>`).join('')}<span style="width:2px"></span>${['渴血','铁靴','黑切','死舞','血手','空位','饰品'].map(n=>`<span class="cm-slot">${n}</span>`).join('')}</span>`;
const aux=p=>`连杀 ${p.spree} · 多杀 ${p.multi} · 线上 ${p.cs-20} / 野怪 20 · CS/分 ${(p.cs/31.7167).toFixed(1)}`;
const stats=p=>[['伤害',p.damage],['承伤',p.taken],['治疗',p.heal],['金币',p.gold],['补刀',p.cs],['视野',p.vision],['控制',p.cc+'s']];
const team=(enemy=false)=>`<div class="cm-team${enemy?' enemy':''}"><span>${enemy?'敌方 · 失败':'我方 · 胜利'} · 5 人</span><small>${enemy?'19 击杀 · 54,020 金币':'42 击杀 · 62,510 金币'}</small></div>`;
const header=()=>`<div class="cm-chrome"><span class="cm-brand">SC 助手</span><b>墨言奇楠天 <small>#67974</small></b><span class="cm-dim">对局记录</span><small class="cm-right">全部模式 · 全部英雄 · 本页 12 胜 5 负</small></div><div class="cm-match"><b class="cm-win">胜利</b><b>亚托克斯</b><b>16 / 1 / 7</b><span>峡谷单双排 · 31:43</span><span class="cm-dim">11-15 12:06</span><button type="button" data-collapse>收起详情 ↑</button></div>`;
const metadata=()=>`<div class="cm-meta"><span>对局 7854210031 · HN1 · 队列 420 · 正常结束</span><span>完整详情 10 / 10 人 · 本局数据全部展开</span></div>`;
const bottom=()=>`<div class="cm-banline"><span>我方禁用：劫 · 永恩 · 莫甘娜 · 悠米 · 凯特琳</span><span>敌方禁用：菲奥娜 · 亚索 · 阿卡丽 · 萨科 · 布里茨</span></div><div class="cm-bottom"><button type="button" data-replay>下载回放</button><button type="button" data-replay>观看回放</button><span>多杀顺序：双 / 三 / 四 / 五</span><span class="cm-right" data-status>布局演示 · 数值与图标占位</span></div>`;
const runeline=aug=>`<span class="cm-runes">符文：${runes.join(' · ')}${aug?' ｜ 强化：珠光护手 · 急救用具 · 巨像的勇气':''}</span>`;
function dense(aug){return [false,true].map(enemy=>team(enemy)+`<div class="cm-dense-head"><span>玩家 / 英雄</span><span style="text-align:right">K / D / A</span>${['伤害','承伤','治疗','金币','补刀','视野','控制'].map(n=>`<span style="text-align:right">${n}</span>`).join('')}</div>`+players.filter(p=>p.enemy===enemy).map(p=>`<article class="cm-dense-row${p.self?' cm-self':''}"><div class="cm-dense-main">${identity(p)}<span class="cm-kda">${p.k}/${p.d}/${p.a}<br><small>KDA ${kda(p)}</small></span>${stats(p).map(([n,v])=>`<span data-label="${n}">${typeof v==='number'?fmt(v):v}</span>`).join('')}</div><div class="cm-dense-secondary">${gear(p)}${runeline(aug)}<span class="cm-aux">${aux(p)}</span></div></article>`).join('')).join('');}
function pcard(p,aug){return `<article class="cm-pcard${p.enemy?' enemy':''}${p.self?' cm-self':''}"><div class="cm-pcard-top">${identity(p)}<div class="cm-kda">${p.k}/${p.d}/${p.a} <small>(${kda(p)})</small></div></div><div class="cm-pcard-metrics">${stats(p).map(([n,v])=>`<span><b>${typeof v==='number'?fmt(v):v}</b></span>`).join('')}</div><div class="cm-load">${gear(p)}${runeline(aug)}</div><div class="cm-aux">${aux(p)}</div></article>`;}
function paired(aug){return `<div class="cm-versus-head">${team(false)+team(true)}</div><div class="cm-versus-head">${[0,1].map(()=>`<div class="cm-metric-labels">${["伤害","承伤","治疗","金币","补刀","视野","控制"].map(n=>`<span>${n}</span>`).join("")}</div>`).join("")}</div>`+players.slice(0,5).map((p,i)=>`<div class="cm-pair">${pcard(p,aug)+pcard(players[i+5],aug)}</div>`).join('');}
function matrix(aug){const rows=[['K / D / A',p=>`<b>${p.k}/${p.d}/${p.a}</b>`],['KDA',kda],['对英雄伤害',p=>fmt(p.damage)],['承受伤害',p=>fmt(p.taken)],['治疗量',p=>fmt(p.heal)],['金币',p=>fmt(p.gold)],['补刀 / 每分钟',p=>`${p.cs} / ${(p.cs/31.7167).toFixed(1)}`],['线上 / 野怪',p=>`${p.cs-20} / 20`],['视野 / 控制',p=>`${p.vision} / ${p.cc}s`],['连杀峰值',p=>p.spree],['双 / 三 / 四 / 五',p=>`<span class="cm-multikill">${p.multi}</span>`],['召唤师技能',p=>`<span class="cm-runes">闪现 · ${p.index===3||p.index===8?'点燃':'传送'}</span>`],['七格装备',p=>`<span class="cm-gear">${['渴血','铁靴','黑切','死舞','血手','空位','饰品'].map(n=>`<span class="cm-slot">${n}</span>`).join('')}</span>`],['完整符文',p=>`<span class="cm-runes cm-fullrunes">${runes.map(n=>`<span>${n}</span>`).join('')}</span>`]];if(aug)rows.push(['强化符文',p=>'<span class="cm-runes">珠光护手<br>急救用具<br>巨像的勇气</span>']);return `<div class="cm-matrix-wrap"><table class="cm-matrix"><thead><tr class="cm-team-band"><th>完整数据</th><th colspan="5">我方 · 胜利 · 42 击杀</th><th colspan="5">敌方 · 失败 · 19 击杀</th></tr><tr><th>玩家 / 英雄</th>${players.map(p=>`<th><span class="cm-portrait">${p.hero[0]}</span><span class="cm-name">${p.name}</span><br><span>#${p.tag}</span><br><span>${p.hero} Lv.${p.level}</span></th>`).join('')}</tr></thead><tbody>${rows.map(([name,value])=>`<tr><td>${name}</td>${players.map(p=>`<td${p.self?' class="cm-self"':''}>${value(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
const saved=globalThis.openai?.widgetState?.modelContent;
for(const type of ['dense','paired','matrix']){const el=root.querySelector('#cm-'+type);const state={augments:false,rowHeight:26};let open=!(saved?.layout===type&&saved.expanded===false);function render(){el.style.setProperty('--rh',state.rowHeight+'px');el.innerHTML=header()+`<div class="cm-body"${open?'':' hidden'}>${metadata()}${type==='dense'?dense(state.augments):type==='paired'?paired(state.augments):matrix(state.augments)}${bottom()}</div>`;const b=el.querySelector('[data-collapse]');b.textContent=open?'收起详情 ↑':'展开详情 ↓';b.addEventListener('click',()=>{open=!open;render();globalThis.openai?.setWidgetState?.({modelContent:{layout:type,expanded:open},privateContent:null}).catch(()=>{});});el.querySelectorAll('[data-replay]').forEach(b=>b.addEventListener('click',()=>{el.querySelector('[data-status]').textContent='设计预览，不执行回放操作';}));}render();window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(s?.layout===type&&typeof s.expanded==='boolean'){open=s.expanded;render();}});if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:render});tweak.addToggle(state,'augments',{label:'带强化数据的对局'});if(type==='matrix')tweak.addSlider(state,'rowHeight',{label:'数据行高度',min:23,max:32,unit:'px'});}}
})();
</script>
